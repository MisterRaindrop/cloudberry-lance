#
# The three stability scripts, run in full.
#
# They are about behaviour under repetition - a thousand failing scans in one
# session, fifty interrupted scans of a 1.5 GB dataset - so they take the better
# part of an hour and need a fixture too large to generate on every push.  CI
# dry-runs them on every push to prove they still work; this proves what they
# assert, weekly and on demand.

name: Stability

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

env:
  CLOUDBERRY_REF: 4717b09068dc1bf5e9697d543b0a81ca0dc6c850
  # SeaweedFS for the s3:// cases, the same release apache/cloudberry's CI uses.
  S3_IMAGE: chrislusf/seaweedfs:4.47
  PYTHON_VERSION: "3.14"
  LANCE_TEST_CONTAINER: cloudberry-lance
  LANCE_TEST_PG_ENV: /usr/local/cloudberry-db/cloudberry-env.sh
  LANCE_TEST_CARGO: direct

jobs:
  stability:
    name: Stability scripts
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: ./.github/actions/cluster
        with:
          cloudberry-ref: ${{ env.CLOUDBERRY_REF }}
          s3-image: ${{ env.S3_IMAGE }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Key the lance-c build
        id: lance-c
        run: echo "sha=$(git rev-parse HEAD:third_party/lance-c)" >> "$GITHUB_OUTPUT"

      # Read-only here: the cache belongs to the CI workflow, which runs far
      # more often and is the one that fills it.
      - name: Restore liblance_c.so
        id: lance-c-cache
        uses: actions/cache/restore@v4
        with:
          path: ci-cache/liblance_c.so
          key: lance-c-${{ runner.arch }}-rocky9-${{ steps.lance-c.outputs.sha }}

      - name: Put the cached liblance_c.so where the build looks
        if: steps.lance-c-cache.outputs.cache-hit == 'true'
        run: |
          dest=/home/gpadmin/cloudberry-lance/third_party/lance-c/target/release
          docker exec -u gpadmin cloudberry-lance mkdir -p "$dest"
          docker cp ci-cache/liblance_c.so "cloudberry-lance:$dest/liblance_c.so"
          docker exec -u root cloudberry-lance chown gpadmin:gpadmin "$dest/liblance_c.so"

      # The suites first: the stability scripts need the extension installed,
      # and a run that cannot pass them has nothing to say about stability.
      - name: Build, install and run the suites
        run: bash test/run/run.sh

      # cancel_loop scans the big fixtures from the S3 service.  They are generated
      # and uploaded after run.sh, and removed from the host afterwards, so that
      # nothing streams 1.75 GB into the container it never reads from there.
      - name: Generate and upload the big fixtures
        run: |
          make -C test/fixtures gen GEN_FLAGS=--with-big
          make -C test/fixtures upload UPLOAD_FLAGS="--datasets big,vectors_big"
          rm -rf test/fixtures/data/big.lance test/fixtures/data/vectors_big.lance

      - name: noregress
        run: bash test/stability/noregress.sh

      - name: leak_loop
        run: bash test/stability/leak_loop.sh

      - name: cancel_loop
        run: bash test/stability/cancel_loop.sh --rounds 50 --dataset big

      - name: cancel_loop, vector search
        run: >-
          bash test/stability/cancel_loop.sh --rounds 50 --scan topk
          --dataset vectors_big --max-median-latency-pct 25
